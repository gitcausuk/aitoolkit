<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'&gt;&lt;rect width='32' height='32' rx='4' fill='%23002147'/&gt;&lt;text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='18' font-weight='700' fill='%23B9D6F2'&gt;AI&lt;/text&gt;&lt;/svg&gt;">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Roboto',system-ui,sans-serif;background:#F2F0F0;color:#211D1C;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 520px at 50% -180px,rgba(255,255,255,0.85),rgba(255,255,255,0) 70%)}
h1,h2,h3{text-wrap:balance;font-optical-sizing:auto}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none!important}
@media(max-width:600px){:root{--nav-pad:0 calc(1rem - 7px);--footer-pad:2rem 1rem 1.75rem}#main-content{padding-left:1rem!important;padding-right:1rem!important}.home-hero{padding:1.2rem 1.25rem 1.15rem!important}.home-intro{padding:1.15rem 1.25rem 1.1rem!important}.home-tasks{padding:1.25rem 1rem 1.1rem!important}.qc-chip{white-space:normal!important}.home-lead{font-weight:400!important}.qc-row{flex-wrap:wrap;align-items:flex-start!important;row-gap:6px!important}.qc-row>span:first-child{flex:1 1 100%;overflow-wrap:normal!important}}
.tab-panel:focus-visible{outline:2px solid #002147!important;outline-offset:6px;border-radius:4px}
.home-task{transition:transform .2s ease,box-shadow .2s ease}
.home-task:hover{transform:translateY(-2px);box-shadow:0 16px 28px -20px rgba(0,33,71,.5)}
.home-task:hover .home-task-open{text-decoration:underline;text-underline-offset:3px}
@media(max-width:720px){.home-task-grid,.home-fit-grid,.home-pair{grid-template-columns:1fr!important}.home-fit-item{border-left:none!important}.home-fit-item+.home-fit-item{border-top:1px solid #D9D8D6}}
main .section-title ~ * .section-title{margin-bottom:1.4rem!important;padding-bottom:1rem!important}
main .section-title ~ * .section-title-heading{font-size:24px!important;line-height:1.25!important}
main .section-title ~ * .section-title-rule{display:none}
#teaching-task-detail .section-title-heading,#teaching-task-detail .section-title-rule{display:none}
#teaching-task-detail .section-title{margin-bottom:1.25rem!important;padding-bottom:1rem!important}
#teaching-task-detail .section-title p{margin-top:0!important}
@media(max-width:640px){.site-footer-credit{text-align:left!important;flex:1 1 100%!important}}
p{text-wrap:pretty}
::selection{background:#002147;color:#FFFFFF}
a{color:#002147;text-underline-offset:3px;text-decoration-color:rgba(0,33,71,0.3)}
a:hover{color:#002147;text-decoration-color:#002147}
button{cursor:pointer;font-family:inherit;border:none;background:none;transition:all 0.18s ease}
select,input,textarea{font-family:inherit;font-size:14px;transition:border-color 0.15s ease,box-shadow 0.15s ease}
select:focus,input:focus,textarea:focus{outline:none;border-color:#15616D!important;box-shadow:0 0 0 3px rgba(21,97,109,0.14)}
textarea{resize:vertical}
body{font-feature-settings:'kern' 1,'liga' 1}
html{scroll-behavior:smooth}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px;height:6px}
@media print{body{background:#FFFFFF!important}nav,div[style*="position:sticky"]{position:static!important}button{display:none!important}.hide-mobile{display:block!important}.hide-on-print{display:none!important}*{box-shadow:none!important}}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#89827A;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#89827A}
button:focus-visible{outline:2px solid #15616D;outline-offset:2px}
a{color:#002147;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:rgba(0,33,71,0.35);text-underline-offset:3px;transition:text-decoration-color 0.15s ease}
a:hover{color:#002147;text-decoration-color:#002147}

    if (['ArrowRight','ArrowLeft','Home','End'].indexOf(e.key) < 0) return;
    var list = t.closest('[role="tablist"]'); if (!list) return;

  });
  function fallbackCopy(text){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    if (!ok) window.alert('Copying was blocked by your browser. Select the text and copy it manually.');
    return ok;
  }
  var cb = navigator.clipboard;
  if (cb && cb.writeText) {
    var orig = cb.writeText.bind(cb);
    try { cb.writeText = function(text){ return orig(text).catch(function(){ if (fallbackCopy(text)) return; throw new Error('copy failed'); }); }; } catch (err) {}
  } else {
    try { navigator.clipboard = { writeText: function(text){ return fallbackCopy(text) ? Promise.resolve() : Promise.reject(new Error('copy failed')); } }; } catch (err) {}
